<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · SkillShare 2.0</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header id="siteNav" class="site-nav"></header>
  <main class="container page">
    <h1 id="welcome">Welcome back</h1>
    <div class="dash-grid">
      <section class="card" id="summary"><p class="muted">Loading...</p></section>
      <section class="card">
        <h2>Skill levels</h2>
        <div id="skillLevels"><p class="muted">Loading...</p></div>
      </section>
      <section class="card">
        <h2>Upcoming sessions</h2>
        <div id="upcoming"><p class="muted">Loading...</p></div>
      </section>
      <section class="card">
        <h2>Connection requests</h2>
        <div id="requests"><p class="muted">Loading...</p></div>
      </section>
      <section class="card wide">
        <h2>Recent activity</h2>
        <div id="activity"><p class="muted">Loading...</p></div>
      </section>
    </div>
  </main>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
